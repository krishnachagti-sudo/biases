<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Bias Atlas">
  <title>Bias Atlas</title>
  <rect width="512" height="512" rx="72" fill="#eceff2"/>
  <!-- The same accuracy-versus-precision target the site wears: a tight cluster
       of hits, consistently off the centre. Geometry mirrors markShapes() in
       src/templates/partials.mjs at 5.12x (its 0-100 viewBox scaled to 512);
       edit one and edit the other. Drawn on paper in ink blue: the two colours
       are the light theme's background and accent tokens, verbatim.
       (No double hyphens below — XML forbids them inside a comment, and this
       file is rasterised by resvg, which enforces that.) -->
  <g fill="none" stroke="#1a4f8a" stroke-width="11">
    <circle cx="256" cy="256" r="205"/>
    <circle cx="256" cy="256" r="132"/>
    <circle cx="256" cy="256" r="59"/>
  </g>
  <g stroke="#1a4f8a" stroke-width="8" stroke-linecap="round">
    <path d="M256 215 v82M215 256 h82"/>
  </g>
  <g fill="#1a4f8a">
    <circle cx="338" cy="159" r="23"/>
    <circle cx="379" cy="195" r="23"/>
    <circle cx="333" cy="215" r="23"/>
  </g>
</svg>
